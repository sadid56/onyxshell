[config]
# Matugen 4.0 configuration

[templates.quickshell]
input_path = '~/.config/matugen/templates/colors.json'
output_path = '~/.config/qs/colors.json'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/kitty-colors.conf'
post_hook = 'kitty @ --to=unix:@mykitty set-colors -a "$HOME/.config/kitty/kitty-colors.conf" || true'

[templates.fish]
input_path = '~/.config/matugen/templates/fish-colors.fish'
output_path = '~/.config/fish/conf.d/matugen_colors.fish'

[templates.hypr]
input_path = '~/.config/matugen/templates/hypr-colors.lua'
output_path = '~/.config/hypr/theme/colors.lua'

[templates.kdeglobals]
input_path = '~/.config/matugen/templates/kdeglobals'
output_path = '~/.config/kdeglobals.hyprland'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'
