

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
command_timeout = 600

# Strict Single-Line Prompt Architecture
format = """\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$git_state\
$nodejs\
$bun\
$deno\
$python\
$rust\
$golang\
$java\
$kotlin\
$c\
$php\
$ruby\
$lua\
$docker_context\
$kubernetes\
$terraform\
$nix_shell\
$package\
$character\
"""

# Right-aligned Telemetry & Runtime Stats
right_format = """\
$cmd_duration\
$status\
$time\
"""

# -----------------------------------------------------------------------------
# Core Prompt Elements
# -----------------------------------------------------------------------------

[os]
disabled = true

[username]
show_always = false
style_user = "bold #cba6f7"
style_root = "bold #f38ba8"
format = "[$user]($style)@"

[hostname]
ssh_only = true
style = "bold #f9e2af"
format = "[$hostname]($style) in "

[directory]
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "bold #f38ba8"
style = "bold #89b4fa"
format = "[$path]($style)[$read_only]($read_only_style) "

# -----------------------------------------------------------------------------
# Git Version Control
# -----------------------------------------------------------------------------

[git_branch]
symbol = " "
style = "bold #a6e3a1"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #f9e2af"
format = '($all_status$ahead_behind)'
conflicted = "[󰞇 $count](bold #f38ba8) "
ahead = "[⇡$count](bold #cba6f7) "
behind = "[⇣$count](bold #f38ba8) "
diverged = "[⇡${ahead_count}⇣${behind_count}](bold #fab387) "
untracked = "[?$count](bold #89dceb) "
stashed = "[󰗊 $count](bold #b4befe) "
modified = "[!$count](bold #f9e2af) "
staged = "[+$count](bold #a6e3a1) "
renamed = "[»$count](bold #74c7ec) "
deleted = "[-$count](bold #eba0ac) "

[git_state]
format = '[\($state( $progress_current/$progress_total)\)]($style) '
style = "bold #f38ba8"

# -----------------------------------------------------------------------------
# Programming Languages & Runtimes
# -----------------------------------------------------------------------------

[nodejs]
symbol = " "
style = "bold #a6e3a1"
format = "[$symbol($version )]($style)"
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

[bun]
symbol = "󰛦 "
style = "bold #f9e2af"
format = "[$symbol($version )]($style)"

[deno]
symbol = "🦕 "
style = "bold #89dceb"
format = "[$symbol($version )]($style)"

[python]
symbol = " "
style = "bold #f9e2af"
format = '[$symbol($version )(\($virtualenv\) )]($style)'
detect_extensions = ["py"]
detect_files = [
    ".python-version",
    "Pipfile",
    "requirements.txt",
    "pyproject.toml",
]

[rust]
symbol = " "
style = "bold #fab387"
format = "[$symbol($version )]($style)"

[golang]
symbol = " "
style = "bold #74c7ec"
format = "[$symbol($version )]($style)"

[java]
symbol = " "
style = "bold #fab387"
format = "[$symbol($version )]($style)"

[kotlin]
symbol = "🅺 "
style = "bold #cba6f7"
format = "[$symbol($version )]($style)"

[c]
symbol = " "
style = "bold #89b4fa"
format = "[$symbol($version )]($style)"

[php]
symbol = " "
style = "bold #cba6f7"
format = "[$symbol($version )]($style)"

[ruby]
symbol = " "
style = "bold #f38ba8"
format = "[$symbol($version )]($style)"

[lua]
symbol = " "
style = "bold #89b4fa"
format = "[$symbol($version )]($style)"

# -----------------------------------------------------------------------------
# Cloud, Containers & Infrastructure
# -----------------------------------------------------------------------------

[docker_context]
symbol = " "
style = "bold #89b4fa"
format = "[$symbol$context]($style) "
only_with_files = true

[kubernetes]
symbol = "󱃾 "
style = "bold #74c7ec"
format = '[$symbol$context(\($namespace\))]($style) '
disabled = false

[terraform]
symbol = "󱁢 "
style = "bold #cba6f7"
format = "[$symbol$workspace]($style) "

[nix_shell]
symbol = " "
style = "bold #74c7ec"
format = "[$symbol$state]($style) "

[package]
symbol = "󰏖 "
style = "bold #cdd6f4"
format = "[$symbol$version]($style) "
disabled = true

# -----------------------------------------------------------------------------
# Prompt Symbols (Single Line Arrow / Vim Mode)
# -----------------------------------------------------------------------------

[character]
success_symbol = "[❯](bold #89b4fa) "
error_symbol = "[❯](bold #f38ba8) "
vimcmd_symbol = "[❮](bold #a6e3a1) "
vimcmd_replace_one_symbol = "[❮](bold #cba6f7) "
vimcmd_replace_symbol = "[❮](bold #cba6f7) "
vimcmd_visual_symbol = "[❮](bold #f9e2af) "

# -----------------------------------------------------------------------------
# Right Side Telemetry
# -----------------------------------------------------------------------------

[cmd_duration]
min_time = 1_500
style = "bold #f9e2af"
format = "󱎫 [$duration]($style) "

[status]
disabled = false
symbol = "󰅖 "
success_symbol = ""
format = "[$symbol$status]($style) "
style = "bold #f38ba8"

[time]
disabled = false
time_format = "%R"
style = "bold #6c7086"
format = "󰥔 [$time]($style) "
