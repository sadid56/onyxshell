<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2e3b"/>
      <stop offset="100%" stop-color="#181920"/>
    </linearGradient>
    <linearGradient id="bellyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf0f5"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <linearGradient id="footGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffb703"/>
      <stop offset="100%" stop-color="#fb8500"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Penguin Feet -->
  <g filter="url(#softShadow)">
    <ellipse cx="44" cy="110" rx="18" ry="9" fill="url(#footGrad)"/>
    <ellipse cx="84" cy="110" rx="18" ry="9" fill="url(#footGrad)"/>
  </g>

  <!-- Penguin Wings / Flippers -->
  <g filter="url(#softShadow)">
    <!-- Left Wing -->
    <path d="M 32 60 C 18 68 12 85 24 98 C 30 104 38 96 38 85 Z" fill="#20222a"/>
    <!-- Right Wing -->
    <path d="M 96 60 C 110 68 116 85 104 98 C 98 104 90 96 90 85 Z" fill="#20222a"/>
  </g>

  <!-- Main Body Silhouette (Head + Torso) -->
  <g filter="url(#softShadow)">
    <path d="M 64 12 C 45 12 36 28 36 48 C 36 58 32 72 28 88 C 24 104 38 112 64 112 C 90 112 104 104 100 88 C 96 72 92 58 92 48 C 92 28 83 12 64 12 Z" fill="url(#bodyGrad)"/>
  </g>

  <!-- White Belly Patch -->
  <path d="M 64 46 C 48 46 42 62 42 80 C 42 98 50 107 64 107 C 78 107 86 98 86 80 C 86 62 80 46 64 46 Z" fill="url(#bellyGrad)"/>

  <!-- Eyes -->
  <g>
    <!-- Left Eye White -->
    <ellipse cx="53" cy="38" rx="7.5" ry="10.5" fill="#ffffff"/>
    <!-- Right Eye White -->
    <ellipse cx="75" cy="38" rx="7.5" ry="10.5" fill="#ffffff"/>
    
    <!-- Left Pupil -->
    <ellipse cx="55" cy="38" rx="4" ry="5.5" fill="#1b1b1b"/>
    <!-- Right Pupil -->
    <ellipse cx="73" cy="38" rx="4" ry="5.5" fill="#1b1b1b"/>

    <!-- Eye Highlights -->
    <circle cx="56.5" cy="35.5" r="1.8" fill="#ffffff"/>
    <circle cx="74.5" cy="35.5" r="1.8" fill="#ffffff"/>
  </g>

  <!-- Cute Beak -->
  <g filter="url(#softShadow)">
    <path d="M 52 46 C 52 44 64 43 76 46 C 78 52 70 59 64 60 C 58 59 50 52 52 46 Z" fill="url(#beakGrad)"/>
    <!-- Beak Highlight -->
    <path d="M 56 46 C 60 44 68 44 72 46 C 68 49 60 49 56 46 Z" fill="#ffe066" opacity="0.6"/>
  </g>
</svg>
